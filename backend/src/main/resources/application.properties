spring.application.name=admin
server.servlet.context-path=/api

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# AWS S3 Configuration (Using IAM roles on EC2)
aws.s3.bucket=fycneetmedia
aws.s3.region=ap-south-1
spring.servlet.multipart.enabled=true
#
spring.servlet.multipart.max-file-size=2000MB
spring.servlet.multipart.max-request-size=2000MB

# Connection Timeouts for large uploads
server.connection-timeout=6000000
server.tomcat.connection-timeout=6000000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tomcat and Payload settings
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-http-post-size=100MB
server.max-http-header-size=65536
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

spring.web.resources.add-mappings=false


