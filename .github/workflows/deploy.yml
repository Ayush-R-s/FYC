name: Full Stack CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::015911059751:role/jest-Deploy
          aws-region: ap-south-1

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Upload to S3
        run: |
          aws s3 sync frontend/dist s3://jestJest-frontend-000710252696 --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2S8JW1KMJ9VRC \
            --paths "/*"


  backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "--- Starting Backend Deployment ---"

            # 1. Navigate to directory
            cd ~/jest/backend
            echo "Current directory: $(pwd)"

            # 2. Update code
            echo "Pulling latest changes from main..."
            git pull origin main

            # 3. Environment check
            echo "Java version info:"
            java -version || echo "Java not found!"

            # 4. Build
            echo "Building with Maven..."
            chmod +x mvnw
            ./mvnw clean package -DskipTests

            # 5. Stop existing app
            echo "Searching for existing process..."
            # Find PID of the running jar, excluding this script's own PID ($$)
            PID=$(pgrep -f "admin-0.0.1-SNAPSHOT.jar" | grep -v $$ || true)
            
            if [ -n "$PID" ]; then
                echo "Stopping existing process(es): $PID"
                kill $PID 2>/dev/null || kill -9 $PID 2>/dev/null || true
                sleep 5
            else
                echo "No existing process found."
            fi


            # 6. Start new app
            echo "Starting new instance..."


            export SPRING_DATASOURCE_URL=${{ secrets.DB_URL }}
            export SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USER }}
            export SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASS }}
            
            # Start in background and detach
            nohup java -jar target/admin-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
            
            echo "--- Deployment Script Sent to Background ---"
            exit 0
