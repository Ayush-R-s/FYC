name: Full Stack CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::000710252696:role/Fyc-Deploy
          aws-region: ap-south-1

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Upload to S3
        run: |
          aws s3 sync frontend/dist s3://www.fycneet.com --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EXWL7GJL8EOP4 \
            --paths "/*"


  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
              cd ~/app/FYC/backend
              git pull origin main

              export SPRING_DATASOURCE_URL=${{ secrets.DB_URL }}
              export SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USER }}
              export SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASS }}

              chmod +x mvnw
              ./mvnw clean package -DskipTests

              ls target

              pkill -f 'admin-0.0.1-SNAPSHOT.jar' || true
              sleep 2

              nohup java -jar target/*.jar > app.log 2>&1 &

              exit 0
